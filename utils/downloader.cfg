# Rewrite googlesource.com URLs to use the /a/ authenticated path.
# This ensures that Bazel's downloader uses the credential helper
# and provides an OAuth Bearer token to Git-on-Borg.
rewrite ([^.]+\.googlesource\.com)/(?!a/)(.*) $1/a/$2

# Airlock repository for Maven dependencies (go/airlock-repositories)
rewrite repo1\.maven\.org/maven2/(.*) us-maven.pkg.dev/artifact-foundry-prod/maven-3p-trusted/$1
rewrite repo\.maven\.apache\.org/maven2/(.*) us-maven.pkg.dev/artifact-foundry-prod/maven-3p-trusted/$1
rewrite maven\.pkg\.jetbrains\.space/public/p/compose/dev/(.*) storage.googleapis.com/emu-next-bazel/maven/$1

# Airlock repository for NPM dependencies (go/airlock-repositories)
rewrite registry\.npmjs\.org/(.*) us-npm.pkg.dev/artifact-foundry-prod/npm-3p-trusted/$1

# Airlock repository for Python / PyPI dependencies (go/airlock-repositories)
rewrite pypi\.org/simple/(.*) us-python.pkg.dev/artifact-foundry-prod/python-3p-trusted/simple/$1
rewrite pypi\.python\.org/simple/(.*) us-python.pkg.dev/artifact-foundry-prod/python-3p-trusted/simple/$1
rewrite files\.pythonhosted\.org/packages/.*/([^-]+)-(.*\.whl) us-python.pkg.dev/artifact-foundry-prod/python-3p-trusted/$1/$1-$2
rewrite files\.pythonhosted\.org/packages/.*/(.*\.whl) storage.googleapis.com/emu-next-bazel/pypi/wheels/$1

# Internal GCS mirror for ARM sysroot toolchain
rewrite developer\.arm\.com/.*/arm-gnu-toolchain-13\.2\.rel1-x86_64-aarch64-none-linux-gnu\.tar\.xz.* storage.googleapis.com/emu-next-bazel/arm-toolchain/arm-gnu-toolchain-13.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz

